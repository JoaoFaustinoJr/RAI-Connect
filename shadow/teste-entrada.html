<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAI Shadow — Teste de entrada</title><style>body{background:#080808;color:#e3c47f;font:16px system-ui;margin:0;padding:25px}main{max-width:420px;margin:auto;text-align:center}button{background:#211a0d;color:#f3d594;border:1px solid #977643;border-radius:14px;padding:16px;margin:12px;cursor:pointer}.bird{font-size:65px}p{line-height:1.6}.ok{color:#9bd0a5}.no{color:#d6a2a2}</style><main><h1>RAI SHADOW</h1><p>Teste local da entrada secreta — não utiliza conta nem dados reais.</p><button class="bird" id="bird" aria-label="Beija-flor de teste">✧</button><p>Toque cinco vezes no símbolo.</p><label><input type="checkbox" id="authorized" checked> Simular usuário autorizado</label><p id="result" role="status">Aguardando teste.</p><p><button id="reset">Reiniciar</button></p><p style="font-size:12px">Usuário não autorizado: não deve aparecer acesso. Usuário autorizado: deve aparecer confirmação. O Connect publicado não é afetado.</p></main><script type="module">import {installShadowEntry} from './entry-gate.js';const result=document.querySelector('#result');const checkbox=document.querySelector('#authorized');const bird=document.querySelector('#bird');const teardown=installShadowEntry({bird,isAuthorized:async()=>checkbox.checked,onOpen:()=>{result.textContent='✓ Cinco toques reconhecidos. Acesso experimental autorizado.';result.className='ok';}});document.querySelector('#reset').onclick=()=>{result.textContent='Aguardando teste.';result.className='';};window.addEventListener('pagehide',teardown);</script></html>
