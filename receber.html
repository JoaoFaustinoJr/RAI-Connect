<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>Compartilhar no Conect</title><body><p>Preparando conteúdo para o Conect…</p><script>(()=>{const params=new URL(location.href).searchParams,parts=[params.get('title'),params.get('text'),params.get('url')].filter(Boolean),text=[...new Set(parts)].join('\n').slice(0,4000);try{if(text)sessionStorage.setItem('conect-share-draft',text);location.replace('./index.html');}catch{document.querySelector('p').textContent='Este navegador não permitiu preparar o compartilhamento. Abra o Conect no Chrome e cole o conteúdo na conversa.';}})();</script></body></html>
