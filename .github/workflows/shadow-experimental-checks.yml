# RAI Shadow — verificação automatizada da ramificação experimental
# Não publica nem modifica o Connect de produção.
name: Shadow experimental checks
on:
  push:
    branches: [feature/rai-shadow-isolado]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: node --check shadow/entry-gate.js
      - name: Test five-tap behavior and authorization
        run: node shadow/entry-gate.test.mjs
      - name: Run Shadow static invariant checks
        run: node shadow/check-invariants.mjs
      - name: Verify isolation invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f shadow/prototipo.html
          test -f shadow/entry-gate.js
          grep -q 'shadowMemberEnabled(supabase)' index.html
          grep -q "frame.setAttribute('sandbox','allow-scripts')" index.html
          if grep -Eq 'allow-scripts allow-same-origin|service_role|sb_secret_' shadow/prototipo.html index.html; then
            echo 'Unsafe sandbox flags or sensitive credential marker found'
            exit 1
          fi
          echo 'Static Shadow checks passed (not a security audit).'
      - name: Prepare isolated preview bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/RAI-Connect-Shadow/shadow
          cp index.html preview/RAI-Connect-Shadow/index.html
          cp shadow/entry-gate.js shadow/prototipo.html preview/RAI-Connect-Shadow/shadow/
          cat > preview/RAI-Connect-Shadow/LEIA-PRIMEIRO.txt <<'EOF'
          RAI Shadow — pacote experimental, não é um endereço publicado.
          Para testar integração com Supabase é obrigatório servidor HTTPS.
          Não enviar mensagens reais nem usar PIN pessoal nesta demonstração.
          O Connect original permanece na ramificação principal.
          EOF
      - name: Save experimental preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: rai-shadow-preview-experimental
          path: preview/RAI-Connect-Shadow/
          retention-days: 7
